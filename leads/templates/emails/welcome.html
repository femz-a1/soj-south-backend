<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Welcome to Streams of Joy South London</title>
</head>

<body style="margin:0; padding:0; background-color:#1e1f23; font-family: Arial, sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 0;">
    <tr>
      <td align="center">

        <table width="600" cellpadding="0" cellspacing="0"
               style="background-color:#2a2c31; border-radius:10px; padding:40px;">

          <!-- LOGO -->
        <img src="assets/images/email-logo.png"
     alt="Streams of Joy South London"
     width="180"
     style="display:block; max-width:180px; width:100%; height:auto;">

          <!-- TITLE -->
          <tr>
            <td align="center" style="padding-bottom:15px;">
              <h1 style="color:#ffffff; margin:0;">You're In ✅</h1>
            </td>
          </tr>

          <!-- MESSAGE -->
          <tr>
            <td align="center"
                style="color:#d0d4db; font-size:16px; line-height:1.6; padding-bottom:30px;">
              Hi {{ name|default:"there" }},<br><br>
              Thank you for signing up with Streams of Joy South London.
              We are excited to welcome you and look forward to seeing you soon.
            </td>
          </tr>

          <!-- GET DIRECTIONS BUTTON -->
          <tr>
            <td align="center" style="padding-bottom:18px;">
              <a href="{{ directions_url }}"
                 style="background-color:#5bb6ff;
                        color:#ffffff;
                        text-decoration:none;
                        padding:14px 28px;
                        border-radius:6px;
                        font-weight:bold;
                        display:inline-block;">
                Get Directions
              </a>
            </td>
          </tr>

          <!-- WHATSAPP BUTTON -->
          <tr>
            <td align="center" style="padding-bottom:30px;">
              <a href="{{ whatsapp_url }}"
                 style="border:2px solid #c9a24d;
                        color:#c9a24d;
                        text-decoration:none;
                        padding:12px 26px;
                        border-radius:6px;
                        font-weight:bold;
                        display:inline-block;">
                Join WhatsApp Channel
              </a>
            </td>
          </tr>

          <!-- FOOTER -->
          <tr>
            <td align="center"
                style="color:#888; font-size:12px;">
              © {{ year }} Streams of Joy South London<br>
              info@streamsofjoysouthlondon.org
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
